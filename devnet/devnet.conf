# Local Ergo devnet for testing Ergo Simple Wallet (on top of the node's built-in devnet.conf, see node.sh).
# Blocks every ~100 ms at difficulty 1, mined by the node itself; nothing here is real money.

ergo {
  directory = ${?ERGO_DEVNET_DATA}

  node {
    mining = true
    offlineGeneration = true
    useExternalMiner = false
    # /blockchain/* address index: the wallet lists an address's boxes with it
    extraIndex = true
  }

  wallet.secretStorage.secretDir = ${ergo.directory}"/wallet/keystore"
}

scorex {
  network.bindAddress = "127.0.0.1:9021"
  restApi {
    bindAddress = "127.0.0.1:9053"
    # Blake2b256("hello"), the devnet default: API key "hello"
    apiKeyHash = "324dcf027dd4a30a932c441f365a25e86b173defa4b8e58948253471b81b72cf"
  }
}
